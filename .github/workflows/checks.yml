name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A PR gets a fresh run per push; the superseded one is canceled rather than finished.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches local development; bump both together.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # generated/ is gitignored and src/server/db.ts imports from it, so typecheck needs this first.
      - name: Generate Prisma client
        run: npx prisma generate
        # prisma.config.ts resolves DIRECT_URL at load; generate reads the schema and never connects.
        env:
          DIRECT_URL: postgresql://prisma:prisma@localhost:5432/generate-only

      - name: Lint
        run: npm run lint

      # Biome is not a type checker; !cancelled() runs this even after Lint fails.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # Needs no database variables: every test that touches Prisma mocks it.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
