# A local Postgres, nothing else. The app runs on the host via `npm run dev`,
# and deploys to Render's native Node environment — there is no app image.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flybox
      POSTGRES_PASSWORD: flybox
      POSTGRES_DB: flybox
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
